<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#efe8da" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151209" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Songbook">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%B8</text></svg>">
<title>Songbook</title>
<style>
  :root{
    --bg:#efe8da; --surface:#f8f3ea; --surface-2:#ece3d1; --text:#2a2416;
    --dim:#71664f; --border:#dcd0b8; --accent:#a5711c; --accent-ink:#7a520f;
    --chord:#a5711c; --ok:#5f7a3f; --shadow:24px 40px rgba(70,52,20,.12);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --lyric:20px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#151209; --surface:#211c12; --surface-2:#2a2418; --text:#ece2cd;
      --dim:#a6977b; --border:#39311f; --accent:#e2b45c; --accent-ink:#f1cd7e;
      --chord:#e6bc6a; --ok:#9cbb6f; --shadow:24px 44px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#151209; --surface:#211c12; --surface-2:#2a2418; --text:#ece2cd;
    --dim:#a6977b; --border:#39311f; --accent:#e2b45c; --accent-ink:#f1cd7e;
    --chord:#e6bc6a; --ok:#9cbb6f; --shadow:24px 44px rgba(0,0,0,.5);
  }
  :root[data-theme="light"]{
    --bg:#efe8da; --surface:#f8f3ea; --surface-2:#ece3d1; --text:#2a2416;
    --dim:#71664f; --border:#dcd0b8; --accent:#a5711c; --accent-ink:#7a520f;
    --chord:#a5711c; --ok:#5f7a3f; --shadow:24px 40px rgba(70,52,20,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    -webkit-text-size-adjust:100%;line-height:1.5;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  a{color:inherit}
  button,input{font-family:inherit}
  button{cursor:pointer;touch-action:manipulation}
  .wrap{max-width:760px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}

  /* ---------- top bar ---------- */
  header.top{
    position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);
    backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
    border-bottom:1px solid var(--border);
    padding-top:env(safe-area-inset-top);
  }
  .top .wrap{display:flex;align-items:center;gap:12px;height:56px}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand .mark{font-size:20px}
  .brand h1{font-family:var(--serif);font-weight:600;font-size:22px;margin:0;letter-spacing:.2px}
  .brand .sub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .spacer{flex:1}
  .iconbtn{
    display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;
    border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:17px;
    transition:transform .08s ease,background .15s ease;
  }
  .iconbtn:active{transform:scale(.94)}
  .iconbtn.back{width:auto;padding:0 14px;gap:7px;font-family:var(--sans);font-size:14px;font-weight:600}

  /* ---------- list ---------- */
  main{padding-bottom:120px}
  .listhead{padding:26px 0 10px}
  .listhead .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .listhead p{margin:6px 0 0;color:var(--dim);font-size:14px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 6px}
  .search{
    flex:1;min-width:180px;display:flex;align-items:center;gap:9px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0 14px;height:46px;
  }
  .search input{border:0;background:transparent;outline:none;color:var(--text);font-size:16px;width:100%}
  .search .mag{color:var(--dim)}
  .tbtn{
    height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--border);background:var(--surface);
    color:var(--text);font-weight:600;font-size:14px;white-space:nowrap;transition:transform .08s ease;
  }
  .tbtn:active{transform:scale(.96)}
  .tbtn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .tbtn.accent,@media(prefers-color-scheme:dark){.tbtn.accent{color:#1a1508}}

  ul.songs{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
  @media(min-width:620px){ul.songs{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
  li.song{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px 16px;
    display:flex;flex-direction:column;gap:5px;min-width:0;transition:transform .1s ease,border-color .15s ease;
  }
  li.song:hover{border-color:var(--accent)}
  li.song:active{transform:scale(.99)}
  .song .row1{display:flex;align-items:center;gap:9px}
  .song .title{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.2}
  .song .preview{color:var(--dim);font-size:13px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{font:700 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;border:1px solid var(--border);color:var(--dim)}
  .chip.ita{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
  .chip.chd{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));display:inline-flex;gap:4px;align-items:center}
  .empty{color:var(--dim);text-align:center;padding:50px 0;font-size:15px}

  /* ---------- reader ---------- */
  .reader{padding-top:8px}
  .reader h2{font-family:var(--serif);font-weight:600;font-size:clamp(26px,7vw,36px);margin:14px 0 2px;line-height:1.1;text-wrap:balance}
  .reader .rmeta{color:var(--dim);font-size:13px;margin-bottom:18px}
  .subbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  .subbar .grp{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px}
  .subbar .grp button{width:36px;height:34px;border:0;background:transparent;color:var(--text);font-size:15px;border-radius:9px}
  .subbar .grp button:active{background:var(--surface-2)}
  .subbar .lab{font-size:12px;color:var(--dim);padding:0 6px;min-width:38px;text-align:center}

  .lyrics{font-family:var(--serif);font-size:var(--lyric);line-height:1.85;padding-bottom:40px}
  .lyrics .sec{
    font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin:26px 0 8px;
  }
  .lyrics .sec:first-child{margin-top:4px}
  .lyrics .note{font-family:var(--sans);font-size:13px;color:var(--dim);font-style:italic;margin:2px 0}
  .lyrics .gap{height:.9em}
  .line{margin:0}
  .line.plain{white-space:pre-wrap}
  .line.chorded{display:flex;flex-wrap:wrap;align-items:flex-end;row-gap:.1em;margin:.05em 0}
  .seg{display:inline-flex;flex-direction:column;justify-content:flex-end}
  .seg .ch{font:700 .74em/1.25 var(--mono);color:var(--chord);letter-spacing:.01em;white-space:pre;min-height:1.35em}
  .seg .ly{white-space:pre}

  /* ---------- autoscroll dock ---------- */
  .dock{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
    z-index:45;display:none;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:8px 8px 8px 8px;box-shadow:0 var(--shadow);width:min(440px,calc(100% - 32px));
  }
  .dock.show{display:flex}
  .play{
    flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#fff;
    font-size:18px;display:grid;place-items:center;transition:transform .08s ease;
  }
  :root[data-theme="dark"] .play{color:#1a1508}
  @media(prefers-color-scheme:dark){.play{color:#1a1508}}
  .play:active{transform:scale(.92)}
  .dock .speed{flex:1;display:flex;align-items:center;gap:9px;padding-right:8px}
  .dock .speed span{font-size:11px;color:var(--dim);white-space:nowrap}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:99px;background:var(--surface-2);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border:2px solid var(--surface);border-radius:50%;background:var(--accent);cursor:pointer}

  /* ---------- editor overlay ---------- */
  .overlay{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
  .overlay.show{display:flex}
  .ohead{border-bottom:1px solid var(--border)}
  .ohead .wrap{display:flex;align-items:center;gap:12px;height:60px}
  .ohead h3{font-family:var(--serif);font-size:18px;margin:0;flex:1}
  .obody{flex:1;overflow:auto}
  .obody .wrap{padding:18px 20px 40px}
  .field{display:block;margin-bottom:14px}
  .field .l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
  .field input,.field textarea{
    width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);
    padding:12px 14px;font-size:16px;outline:none;
  }
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{font-family:var(--mono);font-size:14px;line-height:1.7;min-height:52vh;resize:vertical;white-space:pre;overflow-wrap:normal;overflow-x:auto}
  .help{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--dim);margin-bottom:16px;line-height:1.6}
  .help code{font-family:var(--mono);color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:1px 5px;border-radius:5px}
  .obtns{display:flex;flex-wrap:wrap;gap:10px}
  .obtns .grow{flex:1}
  .danger{color:#c0492b;border-color:color-mix(in srgb,#c0492b 40%,var(--border))}
  :root[data-theme="dark"] .danger,@media(prefers-color-scheme:dark){.danger{color:#e78a6f}}

  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
    background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:70;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ---------- playlists ---------- */
  .tabs{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px;gap:4px;margin:18px 0 4px}
  .tabs button{border:0;background:transparent;color:var(--dim);font-weight:700;font-size:14px;padding:9px 20px;border-radius:10px;transition:background .15s ease}
  .tabs button.on{background:var(--accent);color:#fff}
  :root[data-theme="dark"] .tabs button.on{color:#1a1508}
  @media(prefers-color-scheme:dark){.tabs button.on{color:#1a1508}}
  li.pl{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:13px;transition:border-color .15s ease}
  li.pl:hover{border-color:var(--accent)}
  li.pl .plicon{font-size:18px;color:var(--accent)}
  li.pl .plmeta{flex:1;min-width:0}
  li.pl .plname{font-family:var(--serif);font-size:18px;font-weight:600}
  li.pl .plcount{color:var(--dim);font-size:13px}
  .pllist{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
  .plrow{display:flex;align-items:center;gap:11px;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
  .plrow .num{font:700 13px/1 var(--mono);color:var(--accent);width:22px;text-align:right;flex:none}
  .plrow .pt{flex:1;min-width:0;cursor:pointer}
  .plrow .pt .t{font-family:var(--serif);font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .plrow .pt .s{color:var(--dim);font-size:12px}
  .plrow .ord{display:flex;flex-direction:column;gap:3px}
  .plrow .mini{width:36px;height:25px;border:1px solid var(--border);background:var(--bg);border-radius:8px;color:var(--text);font-size:10px;line-height:1;display:grid;place-items:center}
  .plrow .mini:active{background:var(--surface-2)}
  .plrow .rm{width:36px;height:36px;border:1px solid var(--border);background:var(--bg);border-radius:9px;color:#c0492b;font-size:15px}
  :root[data-theme="dark"] .plrow .rm{color:#e78a6f}
  .plnav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin:0 0 18px}
  .plnav .nm{font-size:12px;color:var(--dim);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;flex:1}
  .plnav button{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;padding:7px 13px;font-weight:600;font-size:13px}
  .plnav button:disabled{opacity:.35}
  .sheet-bg{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:620px){.sheet-bg{align-items:center}}
  .sheet{background:var(--bg);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 var(--shadow)}
  @media(min-width:620px){.sheet{border-radius:20px}}
  .sheet h4{font-family:var(--serif);font-size:19px;margin:0;flex:1}
  .sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
  .sheet .sb{overflow:auto;padding:8px 10px 16px}
  .pick{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:11px;cursor:pointer}
  .pick:active{background:var(--surface)}
  .pick .box{width:24px;height:24px;border:2px solid var(--border);border-radius:7px;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
  .pick.on .box{background:var(--accent);border-color:var(--accent)}
  :root[data-theme="dark"] .pick.on .box{color:#1a1508}
  @media(prefers-color-scheme:dark){.pick.on .box{color:#1a1508}}
  .pick .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="iconbtn back hidden" id="backBtn" aria-label="Indietro">‹ Canzoni</button>
    <div class="brand" id="brand">
      <span class="mark">🎸</span>
      <h1>Songbook</h1>
      <span class="sub" id="brandSub">20 canzoni</span>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn" aria-label="Tema">◐</button>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="dock" id="dock">
  <button class="play" id="playBtn" aria-label="Autoscroll">▶</button>
  <div class="speed">
    <span>Autoscroll</span>
    <input type="range" id="speed" min="8" max="150" step="2" value="40" aria-label="Velocità">
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="ohead"><div class="wrap">
    <h3 id="edTitleH">Modifica</h3>
    <button class="tbtn" id="edCancel">Annulla</button>
    <button class="tbtn accent" id="edSave">Salva</button>
  </div></div>
  <div class="obody"><div class="wrap">
    <div class="help">
      Accordi: scrivi <code>[G]</code> subito prima della parola dove cambia l'accordo, es. <code>[G]I feel it [Em]lifting</code>. Vengono mostrati in oro sopra il testo.<br>
      Sezioni: una riga da sola come <code>[Verse 1]</code>, <code>[Chorus]</code>, <code>[Bridge]</code> diventa un'etichetta.
    </div>
    <label class="field"><span class="l">Titolo</span><input id="edTitle" type="text" autocomplete="off"></label>
    <label class="field"><span class="l">Testo e accordi</span><textarea id="edBody" spellcheck="false"></textarea></label>
    <div class="obtns">
      <button class="tbtn" id="edRestore">↺ Ripristina originale</button>
      <button class="tbtn danger" id="edDelete">Elimina canzone</button>
    </div>
  </div></div>
</div>

<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================ DATI ============================ */

const SKEY="mysongs.songs.v1", PKEY="mysongs.prefs.v1", PLKEY="mysongs.playlists.v1";
function clone(o){return JSON.parse(JSON.stringify(o));}
let songs=[], prefs={theme:"auto",size:20,speed:40}, playlists=[];

// playlist di partenza (solo al primo avvio; se la cancelli resta cancellata)

  {id:"pl-concerto",name:"Concerto stasera",songIds:[
    "everything-will-go-my-way","shine-again","tell-me-a-story","you-must-be-an-angel",
    "im-proud-of-you","the-garden","what-i-learned","walking-towards-the-light",

];

function loadAll(){
  try{prefs=Object.assign(prefs,JSON.parse(localStorage.getItem(PKEY)||"{}"));}catch(e){}
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem(SKEY));}catch(e){}
  if(Array.isArray(saved)&&saved.length){
    songs=saved;
    // aggiungi eventuali canzoni di default nuove non ancora salvate
    const ids=new Set(songs.map(s=>s.id));
    DEFAULT_SONGS.forEach(d=>{if(!ids.has(d.id))songs.push(clone(d));});
  }else{
    songs=DEFAULT_SONGS.map(clone);
  }
  let sp=null;
  try{sp=JSON.parse(localStorage.getItem(PLKEY));}catch(e){}
  playlists=Array.isArray(sp)?sp:DEFAULT_PLAYLISTS.map(clone);
}
function saveSongs(){try{localStorage.setItem(SKEY,JSON.stringify(songs));}catch(e){}}
function savePrefs(){try{localStorage.setItem(PKEY,JSON.stringify(prefs));}catch(e){}}
function savePlaylists(){try{localStorage.setItem(PLKEY,JSON.stringify(playlists));}catch(e){}}

/* ============================ CHORD PARSING ============================ */
const CHORD_RE=/^[A-G](##|bb|#|b)?(maj|min|dim|aug|sus|add|m|M|\+)?\d{0,2}(sus[24]|add\d{1,2})?((#|b)\d{1,2})*(\/[A-G](#|b)?)?$/;
function isChord(t){t=t.trim();return t.length>0&&t.length<=12&&CHORD_RE.test(t);}
function hasChords(body){
  return body.split("\n").some(line=>{
    const t=line.trim();
    if(/^\[.+\]$/.test(t)) return false; // riga-sezione
    let m,re=/\[([^\]]+)\]/g;
    while((m=re.exec(line))!==null){if(isChord(m[1]))return true;}
    return false;
  });
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}

function parseLyricLine(line){
  const matches=[]; let m,re=/\[([^\]]+)\]/g;
  while((m=re.exec(line))!==null) matches.push(m);
  if(!matches.length) return null; // niente accordi -> riga semplice
  const segs=[];
  const lead=line.slice(0,matches[0].index);
  if(lead) segs.push({chord:"",text:lead});
  for(let i=0;i<matches.length;i++){
    const inner=matches[i][1];
    const start=matches[i].index+matches[i][0].length;
    const end=(i+1<matches.length)?matches[i+1].index:line.length;
    const text=line.slice(start,end);
    if(isChord(inner)) segs.push({chord:inner.trim(),text:text});
    else segs.push({chord:"",text:"["+inner+"]"+text});
  }
  return segs;
}

function renderLyrics(body){
  const out=[];
  body.split("\n").forEach(raw=>{
    const t=raw.trim();
    if(t===""){out.push('<div class="gap"></div>');return;}
    const secMatch=t.match(/^\[(.+)\]$/);
    if(secMatch){
      if(isChord(secMatch[1])){
        out.push('<div class="line chorded"><span class="seg"><span class="ch">'+esc(secMatch[1])+'</span><span class="ly"> </span></span></div>');
      }else{
        out.push('<div class="sec">'+esc(secMatch[1])+'</div>');
      }
      return;
    }
    if(/^(Title|Language|Meter|Theme|Chords)\b/i.test(t)){
      out.push('<div class="note">'+esc(raw)+'</div>');return;
    }
    const segs=parseLyricLine(raw);
    if(!segs){out.push('<div class="line plain">'+esc(raw)+'</div>');return;}
    let html='<div class="line chorded">';
    segs.forEach(s=>{
      html+='<span class="seg"><span class="ch">'+esc(s.chord)+'</span><span class="ly">'+esc(s.text===""?" ":s.text)+'</span></span>';
    });
    html+='</div>';
    out.push(html);
  });
  return out.join("");
}

/* ============================ VIEW ============================ */
const $=s=>document.querySelector(s);
const main=$("#main"), backBtn=$("#backBtn"), brand=$("#brand"),
      brandSub=$("#brandSub"), dock=$("#dock"), overlay=$("#overlay");
let currentId=null, filter="", homeTab="songs", playCtx=null;

function firstLyric(body){
  const l=body.split("\n").find(x=>{const t=x.trim();return t&&!/^\[.+\]$/.test(t)&&!/^(Title|Language|Meter|Theme|Chords)\b/i.test(t);});
  return l?l.replace(/\[[^\]]+\]/g,"").trim():"";
}

function renderList(){
  stopScroll();
  currentId=null; playCtx=null;
  backBtn.classList.add("hidden");
  brand.classList.remove("hidden");
  dock.classList.remove("show");
  brandSub.textContent=songs.length+" canzoni";
  main.className="wrap";
  main.innerHTML=
    '<div class="tabs">'+
      '<button id="tabSongs" class="'+(homeTab==="songs"?"on":"")+'">Canzoni</button>'+
      '<button id="tabPl" class="'+(homeTab==="playlists"?"on":"")+'">Playlist</button>'+
    '</div>'+
    '<div id="homeArea"></div>';
  $("#tabSongs").addEventListener("click",()=>{homeTab="songs";renderList();});
  $("#tabPl").addEventListener("click",()=>{homeTab="playlists";renderList();});
  if(homeTab==="playlists") renderPlaylistsTab(); else renderSongsTab();
}
function renderSongsTab(){
  const area=$("#homeArea");if(!area)return;
  area.innerHTML=
    '<div class="toolbar">'+
      '<label class="search"><span class="mag">⌕</span><input id="q" type="search" placeholder="Cerca titolo o parola..." value="'+esc(filter)+'"></label>'+
      '<button class="tbtn accent" id="newBtn">+ Nuova</button>'+
      '<button class="tbtn" id="impBtn">Importa</button>'+
      '<button class="tbtn" id="expBtn">Esporta</button>'+
    '</div>'+
    '<div id="listArea"></div>';

  $("#q").addEventListener("input",e=>{filter=e.target.value;renderItems();});
  $("#newBtn").addEventListener("click",newSong);
  $("#impBtn").addEventListener("click",()=>$("#importFile").click());
  $("#expBtn").addEventListener("click",exportData);
}
function renderItems(){
  const area=$("#listArea");if(!area)return;
  const q=filter.trim().toLowerCase();
  const shown=songs.filter(s=>!q||s.title.toLowerCase().includes(q)||s.body.toLowerCase().includes(q));
  if(!shown.length){area.innerHTML='<div class="empty">Nessuna canzone trovata.</div>';return;}
  area.innerHTML='<ul class="songs">'+shown.map(s=>{
    const ita=s.lang==="it"?'<span class="chip ita">ITA</span>':'';
    const chd=hasChords(s.body)?'<span class="chip chd">♪ accordi</span>':'';
    return '<li class="song" data-id="'+s.id+'"><div class="row1"><span class="title">'+esc(s.title)+'</span>'+ita+chd+'</div><div class="preview">'+esc(firstLyric(s.body))+'</div></li>';
  }).join("")+'</ul>';
  area.querySelectorAll("li.song").forEach(li=>li.addEventListener("click",()=>openSong(li.dataset.id)));

function renderPlaylistsTab(){
  const area=$("#homeArea");if(!area)return;

  if(!playlists.length){
    html+='<div class="empty">Nessuna playlist.<br>Creane una per la tua scaletta.</div>';
  }else{
    html+='<ul class="songs">'+playlists.map(p=>{
      const n=p.songIds.filter(id=>songs.some(s=>s.id===id)).length;
      return '<li class="pl" data-id="'+p.id+'"><span class="plicon">☰</span><div class="plmeta"><div class="plname">'+esc(p.name)+'</div><div class="plcount">'+n+' bran'+(n===1?"o":"i")+'</div></div><span class="plicon">›</span></li>';
    }).join("")+'</ul>';

function newPlaylist(){
  const name=prompt("Nome della playlist:","Nuova playlist");
  if(name===null)return;
  const id="pl-"+Date.now();
  playlists.unshift({id:id,name:name.trim()||"Nuova playlist",songIds:[]});
  savePlaylists();location.hash="#/pl/"+id;
}
function openPlaylist(id){
  stopScroll();
  const p=playlists.find(x=>x.id===id);
  if(!p){location.hash="";return;}
  currentId=null; playCtx=null; homeTab="playlists";
  backBtn.classList.remove("hidden");
  backBtn.textContent="‹ Playlist";
  brand.classList.add("hidden");
  dock.classList.remove("show");
  window.scrollTo(0,0);
  const valid=p.songIds.filter(sid=>songs.some(s=>s.id===sid));
  let rows;
  if(!valid.length){
    rows='<div class="empty">Playlist vuota.<br>Aggiungi le canzoni della scaletta.</div>';
  }else{
    rows='<div class="pllist">'+valid.map((sid,i)=>{
      const s=songs.find(x=>x.id===sid);
      return '<div class="plrow">'+
        '<span class="num">'+(i+1)+'</span>'+
        '<div class="pt" data-open="'+sid+'"><div class="t">'+esc(s.title)+'</div><div class="s">'+(s.lang==="it"?"Italiano":"English")+(hasChords(s.body)?" · accordi":"")+'</div></div>'+
        '<div class="ord"><button class="mini" data-up="'+i+'" aria-label="Su">▲</button><button class="mini" data-down="'+i+'" aria-label="Giù">▼</button></div>'+
        '<button class="rm" data-rm="'+sid+'" aria-label="Rimuovi dalla playlist">✕</button>'+
      '</div>';
    }).join("")+'</div>';
  }
  main.className="wrap reader";
  main.innerHTML=
    '<h2>'+esc(p.name)+'</h2>'+
    '<div class="rmeta">'+valid.length+' bran'+(valid.length===1?"o":"i")+' nella scaletta</div>'+
    '<div class="subbar">'+
      (valid.length?'<button class="tbtn accent" id="plPlay">▶ Suona dall\'inizio</button>':'')+
      '<button class="tbtn" id="plAdd">+ Aggiungi canzoni</button>'+
      '<button class="tbtn" id="plRen">✎ Rinomina</button>'+
      '<button class="tbtn danger" id="plDel">Elimina</button>'+
    '</div>'+rows;
  if(valid.length) $("#plPlay").addEventListener("click",()=>openSong(valid[0],{plId:id,idx:0}));
  $("#plAdd").addEventListener("click",()=>openPicker(id));
  $("#plRen").addEventListener("click",()=>{
    const nn=prompt("Rinomina playlist:",p.name);if(nn===null)return;
    p.name=nn.trim()||p.name;savePlaylists();openPlaylist(id);
  });
  $("#plDel").addEventListener("click",()=>{
    if(!confirm("Eliminare la playlist \""+p.name+"\"? Le canzoni restano nel songbook."))return;
    playlists=playlists.filter(x=>x.id!==id);savePlaylists();location.hash="";toast("Playlist eliminata");
  });
  main.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",()=>{
    const sid=el.getAttribute("data-open");openSong(sid,{plId:id,idx:valid.indexOf(sid)});
  }));
  main.querySelectorAll("[data-rm]").forEach(el=>el.addEventListener("click",()=>{
    const sid=el.getAttribute("data-rm");p.songIds=p.songIds.filter(x=>x!==sid);savePlaylists();openPlaylist(id);
  }));
  main.querySelectorAll("[data-up]").forEach(el=>el.addEventListener("click",()=>movePl(p,+el.getAttribute("data-up"),-1)));
  main.querySelectorAll("[data-down]").forEach(el=>el.addEventListener("click",()=>movePl(p,+el.getAttribute("data-down"),1)));
}
function movePl(p,i,dir){
  const valid=p.songIds.filter(sid=>songs.some(s=>s.id===sid));
  const j=i+dir;
  if(j<0||j>=valid.length)return;
  const ia=p.songIds.indexOf(valid[i]), ib=p.songIds.indexOf(valid[j]);
  const tmp=p.songIds[ia];p.songIds[ia]=p.songIds[ib];p.songIds[ib]=tmp;
  savePlaylists();openPlaylist(p.id);
}
function openPicker(plId){
  const p=playlists.find(x=>x.id===plId);if(!p)return;
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML='<div class="sheet">'+
    '<div class="sh"><h4>Aggiungi canzoni</h4><button class="tbtn accent" id="pkDone">Fatto</button></div>'+
    '<div class="sh"><label class="search" style="width:100%"><span class="mag">⌕</span><input id="pkq" type="search" placeholder="Cerca canzone..."></label></div>'+
    '<div class="sb">'+songs.map(s=>{
      const on=p.songIds.includes(s.id);
      return '<div class="pick '+(on?"on":"")+'" data-id="'+s.id+'" data-t="'+esc(s.title.toLowerCase())+'"><span class="box">'+(on?"✓":"")+'</span><span class="pn">'+esc(s.title)+'</span></div>';
    }).join("")+'</div></div>';
  function close(){bg.remove();document.body.style.overflow="";openPlaylist(plId);}
  bg.querySelector("#pkDone").addEventListener("click",close);
  bg.addEventListener("click",e=>{if(e.target===bg)close();});
  bg.querySelector("#pkq").addEventListener("input",e=>{
    const q=e.target.value.trim().toLowerCase();
    bg.querySelectorAll(".pick").forEach(el=>{el.style.display=(!q||el.getAttribute("data-t").includes(q))?"":"none";});
  });
  bg.querySelectorAll(".pick").forEach(el=>el.addEventListener("click",()=>{
    const sid=el.getAttribute("data-id");
    if(p.songIds.includes(sid)){p.songIds=p.songIds.filter(x=>x!==sid);el.classList.remove("on");el.querySelector(".box").textContent="";}
    else{p.songIds.push(sid);el.classList.add("on");el.querySelector(".box").textContent="✓";}
    savePlaylists();
  }));
  document.body.appendChild(bg);document.body.style.overflow="hidden";

function openAddTo(songId){
  const bg=document.createElement("div");bg.className="sheet-bg";
  function draw(){
    bg.innerHTML='<div class="sheet">'+
      '<div class="sh"><h4>Aggiungi a playlist</h4><button class="tbtn accent" id="atDone">Fatto</button></div>'+
      '<div class="sb">'+(playlists.length?playlists.map(p=>{
        const on=p.songIds.includes(songId);
        return '<div class="pick '+(on?"on":"")+'" data-id="'+p.id+'"><span class="box">'+(on?"✓":"")+'</span><span class="pn">'+esc(p.name)+'</span></div>';
      }).join(""):'<div class="empty">Nessuna playlist ancora.</div>')+'</div>'+
      '<div class="sh"><button class="tbtn" id="atNew" style="width:100%">+ Nuova playlist</button></div></div>';
    bg.querySelector("#atDone").addEventListener("click",close);
    bg.querySelector("#atNew").addEventListener("click",()=>{
      const name=prompt("Nome della playlist:","Nuova playlist");if(name===null)return;
      playlists.unshift({id:"pl-"+Date.now(),name:name.trim()||"Nuova playlist",songIds:[songId]});
      savePlaylists();toast("Creata e aggiunta");draw();
    });
    bg.querySelectorAll(".pick").forEach(el=>el.addEventListener("click",()=>{
      const p=playlists.find(x=>x.id===el.getAttribute("data-id"));if(!p)return;
      if(p.songIds.includes(songId)){p.songIds=p.songIds.filter(x=>x!==songId);el.classList.remove("on");el.querySelector(".box").textContent="";}
      else{p.songIds.push(songId);el.classList.add("on");el.querySelector(".box").textContent="✓";}
      savePlaylists();
    }));
  }
  function close(){bg.remove();document.body.style.overflow="";}
  bg.addEventListener("click",e=>{if(e.target===bg)close();});
  document.body.appendChild(bg);document.body.style.overflow="hidden";draw();
}

function openSong(id,ctx){
  const s=songs.find(x=>x.id===id);if(!s)return;

  if(ctx&&ctx.plId){playCtx={plId:ctx.plId};location.hash="#/pl/"+ctx.plId+"/"+id;}
  else{playCtx=null;location.hash="#/"+id;}

  backBtn.textContent=playCtx?"‹ Scaletta":"‹ Canzoni";
  brand.classList.add("hidden");

  const meta=[s.lang==="it"?"Italiano":"English"];

  if(playCtx){
    pl=playlists.find(x=>x.id===playCtx.plId);
    if(pl){
      valid=pl.songIds.filter(sid=>songs.some(x=>x.id===sid));
      pos=valid.indexOf(id);
      nav='<div class="plnav">'+
        '<button id="prevSong"'+(pos<=0?" disabled":"")+'>‹ Prec</button>'+
        '<span class="nm">'+esc(pl.name)+' · '+(pos+1)+'/'+valid.length+'</span>'+
        '<button id="nextSong"'+(pos>=valid.length-1?" disabled":"")+'>Succ ›</button>'+
      '</div>';
    }

  main.className="wrap reader";

    '<h2>'+esc(s.title)+'</h2>'+

    nav+
    '<div class="subbar">'+
      '<div class="grp"><button id="szDown" aria-label="Testo più piccolo">A−</button>'+

  $("#editBtn").addEventListener("click",()=>openEditor(id));

  $("#szUp").addEventListener("click",()=>setSize(prefs.size+1));
  if(pl&&pos>0)$("#prevSong").addEventListener("click",()=>openSong(valid[pos-1],{plId:pl.id}));
  if(pl&&pos>=0&&pos<valid.length-1)$("#nextSong").addEventListener("click",()=>openSong(valid[pos+1],{plId:pl.id}));

function setSize(v){
  prefs.size=Math.max(15,Math.min(32,v));savePrefs();
  document.documentElement.style.setProperty("--lyric",prefs.size+"px");
  const lab=$("#szLab");if(lab)lab.textContent=prefs.size;
}

/* ============================ AUTOSCROLL ============================ */
let scroll={on:false,raf:0,last:0,acc:0};
const playBtn=$("#playBtn"), speedEl=$("#speed");
function startScroll(){
  if(scroll.on)return;
  scroll.on=true;scroll.last=0;scroll.acc=0;
  playBtn.textContent="❚❚";
  scroll.raf=requestAnimationFrame(tick);
}
function stopScroll(){
  scroll.on=false;playBtn.textContent="▶";
  if(scroll.raf)cancelAnimationFrame(scroll.raf);
}
function tick(ts){
  if(!scroll.on)return;
  if(!scroll.last)scroll.last=ts;
  const dt=Math.min(0.05,(ts-scroll.last)/1000);scroll.last=ts;
  scroll.acc+=prefs.speed*dt;
  if(scroll.acc>=1){
    const px=Math.floor(scroll.acc);scroll.acc-=px;
    const before=window.scrollY;
    window.scrollBy(0,px);
    if(Math.abs(window.scrollY-before)<0.5){stopScroll();return;}
  }
  scroll.raf=requestAnimationFrame(tick);
}
playBtn.addEventListener("click",()=>{scroll.on?stopScroll():startScroll();});
speedEl.value=prefs.speed;
speedEl.addEventListener("input",e=>{prefs.speed=+e.target.value;savePrefs();});

/* ============================ EDITOR ============================ */
let editingId=null;
function openEditor(id){
  stopScroll();
  const s=songs.find(x=>x.id===id);if(!s)return;
  editingId=id;
  $("#edTitleH").textContent="Modifica canzone";
  $("#edTitle").value=s.title;
  $("#edBody").value=s.body;
  const isDefault=DEFAULT_SONGS.some(d=>d.id===id);
  $("#edRestore").classList.toggle("hidden",!isDefault);
  $("#edDelete").classList.toggle("hidden",isDefault);
  overlay.classList.add("show");
  document.body.style.overflow="hidden";
}
function closeEditor(){overlay.classList.remove("show");document.body.style.overflow="";editingId=null;}
$("#edCancel").addEventListener("click",closeEditor);
$("#edSave").addEventListener("click",()=>{
  const s=songs.find(x=>x.id===editingId);if(!s)return;
  s.title=$("#edTitle").value.trim()||"Senza titolo";
  s.body=$("#edBody").value;
  const ctx=playCtx?{plId:playCtx.plId}:undefined;
  saveSongs();closeEditor();openSong(s.id,ctx);toast("Salvato");
});
$("#edRestore").addEventListener("click",()=>{
  const d=DEFAULT_SONGS.find(x=>x.id===editingId);if(!d)return;
  if(!confirm("Ripristinare il testo originale di questa canzone?"))return;
  $("#edTitle").value=d.title;$("#edBody").value=d.body;
});
$("#edDelete").addEventListener("click",()=>{
  if(!confirm("Eliminare definitivamente questa canzone?"))return;
  const gone=editingId;
  songs=songs.filter(x=>x.id!==gone);
  playlists.forEach(p=>{p.songIds=p.songIds.filter(x=>x!==gone);});
  saveSongs();savePlaylists();closeEditor();homeTab="songs";location.hash="";renderList();toast("Eliminata");
});
function newSong(){
  const id="song-"+Date.now();
  playCtx=null;
  songs.unshift({id:id,lang:"it",title:"Nuova canzone",body:"[Verse 1]\n"});
  saveSongs();openEditor(id);
}

/* ============================ IMPORT / EXPORT ============================ */
async function exportData(){
  const payload=JSON.stringify({app:"my-songs",version:2,exportedAt:new Date().toISOString(),songs:songs,playlists:playlists},null,2);
  const filename="my-songs-"+new Date().toISOString().slice(0,10)+".json";
  if(window.claude&&window.claude.downloads){
    try{await window.claude.downloads.save({filename:filename,data:payload});toast("Esportato");return;}
    catch(e){if(e&&e.code==="declined"){return;}}
  }
  try{
    const blob=new Blob([payload],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();
    a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Esportato");
  }catch(e){toast("Export non riuscito");}
}
$("#importFile").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      const arr=Array.isArray(data)?data:data.songs;
      if(!Array.isArray(arr))throw 0;
      const clean=arr.filter(x=>x&&x.id&&typeof x.title==="string"&&typeof x.body==="string")
                     .map(x=>({id:String(x.id),lang:x.lang==="it"?"it":"en",title:x.title,body:x.body}));
      if(!clean.length)throw 0;
      if(!confirm("Importare "+clean.length+" canzoni? Sostituiranno canzoni e playlist attuali su questo dispositivo."))return;
      songs=clean;saveSongs();
      if(data&&Array.isArray(data.playlists)){
        playlists=data.playlists
          .filter(p=>p&&p.id&&typeof p.name==="string"&&Array.isArray(p.songIds))
          .map(p=>({id:String(p.id),name:p.name,songIds:p.songIds.map(String)}));
        savePlaylists();
      }
      location.hash="";renderList();toast("Importate "+clean.length);
    }catch(err){toast("File non valido");}
  };
  r.readAsText(f);
  e.target.value="";
});

/* ============================ THEME + MISC ============================ */
function applyTheme(t){
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  const b=$("#themeBtn");
  b.textContent=t==="dark"?"☾":t==="light"?"☀":"◐";
}
$("#themeBtn").addEventListener("click",()=>{
  const order=["auto","light","dark"];
  prefs.theme=order[(order.indexOf(prefs.theme)+1)%3];
  savePrefs();applyTheme(prefs.theme);
});
let toastT=0;
function toast(msg){
  const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800);
}
backBtn.addEventListener("click",()=>{
  if(playCtx){location.hash="#/pl/"+playCtx.plId;}
  else{location.hash="";}
});
window.addEventListener("hashchange",route);
function route(){
  const h=location.hash.replace(/^#\/?/,"");
  const parts=h.split("/").filter(x=>x!=="");
  if(parts[0]==="pl"&&parts.length===2){openPlaylist(parts[1]);return;}
  if(parts[0]==="pl"&&parts.length>=3){
    const plId=parts[1],sid=parts[2];
    if(currentId===sid&&playCtx&&playCtx.plId===plId)return;
    if(songs.some(s=>s.id===sid)){openSong(sid,{plId:plId});return;}
    renderList();return;
  }
  if(parts.length===1&&songs.some(s=>s.id===parts[0])){
    if(currentId!==parts[0]||playCtx)openSong(parts[0]);
    return;
  }
  renderList();
}

/* ============================ SYNC (repo = fonte di verità) ============================ */
const DVKEY="mysongs.dataVersion";
function syncFromRepo(){
  fetch("data.json?cb="+Date.now(),{cache:"no-store"})
    .then(r=>r.ok?r.json():null)
    .then(d=>{
      if(!d||typeof d.dataVersion!=="number"||!Array.isArray(d.songs))return;
      let seen=0; try{seen=parseInt(localStorage.getItem(DVKEY)||"0",10)||0;}catch(e){}
      if(d.dataVersion<=seen)return;
      songs=d.songs;
      if(Array.isArray(d.playlists))playlists=d.playlists;
      saveSongs();savePlaylists();
      try{localStorage.setItem(DVKEY,String(d.dataVersion));}catch(e){}
      route();
      if(seen>0)toast("Libreria aggiornata");
    }).catch(()=>{});
}

/* ============================ BOOT ============================ */
loadAll();
applyTheme(prefs.theme);
document.documentElement.style.setProperty("--lyric",prefs.size+"px");
route();
syncFromRepo();
</script>
